# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Planet Puberty Game

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "known_hosts"

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: GENERATE_SOURCEMAP=false CI=false npm run build

      - name: Add subbfolder routes
        run: mkdir -p build/private-and-public && mkdir -p build/identifying-feelings && mkdir -p build/who-in-my-orbit && cp -r build/index.html build/private-and-public/index.html && cp -r build/index.html build/identifying-feelings/index.html && cp -r build/index.html build/who-in-my-orbit/index.html

      - name: Deploy
        run: rsync -avz --delete ./build/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/xenia_wp_team/gppgame.dreamhosters.com
